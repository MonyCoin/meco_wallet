name: EAS Update on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  update:
    name: Build and Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: node scripts/check-i18n.js

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          eas update --branch production --environment production --platform android --message "$COMMIT_MESSAGE" --non-interactive
