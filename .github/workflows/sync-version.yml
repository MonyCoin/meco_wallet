name: Sync version.json to meco_wallet-app

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-version-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # لتعديل ملاحظات الإصدار (إضافة بصمة SHA-256)
    steps:
      - name: Checkout meco_wallet-app repo
        uses: actions/checkout@v4
        with:
          repository: MonyCoin/meco_wallet-app
          token: ${{ secrets.PAT_TOKEN }}
          ref: main

      - name: Extract version
        id: version
        run: |
          # في حال التشغيل التلقائي، نأخذ من الـ release
          # في حال التشغيل اليدوي، نقرأ آخر release من GitHub API
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(curl -s https://api.github.com/repos/MonyCoin/meco_wallet/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get APK download URL
        id: apk
        run: |
          # إذا كان التشغيل تلقائيًا عبر Release: نأخذ الرابط من بيانات الحدث مباشرة
          # إذا كان التشغيل يدويًا: نجلبه من GitHub API لآخر إصدار
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            URL=$(echo '${{ toJson(github.event.release.assets) }}' | jq -r '.[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          else
            URL=$(curl -s https://api.github.com/repos/MonyCoin/meco_wallet/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          fi
          
          # التحقق من وجود الرابط
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Error: No APK asset found in the release"
            exit 1
          fi
          
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Compute APK SHA-256
        id: sha
        env:
          APK_URL: ${{ steps.apk.outputs.url }}
        run: |
          curl -fsSL -o /tmp/release.apk "$APK_URL"
          SHA=$(sha256sum /tmp/release.apk | awk '{print $1}')
          NAME=$(basename "$APK_URL")
          rm -f /tmp/release.apk
          if [ -z "$SHA" ] || [ ${#SHA} -ne 64 ]; then
            echo "Error: failed to compute SHA-256"
            exit 1
          fi
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Update version.json
        run: |
          cat > version.json <<EOF
          {
            "latestVersion": "${{ steps.version.outputs.version }}",
            "buildNumber": "${{ github.run_number }}",
            "releaseNotes": "تحديث تلقائي للإصدار ${{ steps.version.outputs.tag }}",
            "downloadUrl": "${{ steps.apk.outputs.url }}",
            "apkName": "${{ steps.sha.outputs.name }}",
            "sha256": "${{ steps.sha.outputs.sha256 }}"
          }
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: auto-sync version.json to ${{ steps.version.outputs.version }}"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/MonyCoin/meco_wallet-app.git main

      - name: Add SHA-256 to release notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha256 }}
          NAME: ${{ steps.sha.outputs.name }}
        run: |
          BODY=$(gh release view "$TAG" --repo MonyCoin/meco_wallet --json body -q .body)
          if echo "$BODY" | grep -q "SHA-256"; then
            echo "Checksum already present in release notes"
            exit 0
          fi
          {
            printf '%s\n\n' "$BODY"
            printf -- '---\n'
            printf '**SHA-256 (%s):**\n\n`%s`\n' "$NAME" "$SHA"
          } > /tmp/notes.md
          gh release edit "$TAG" --repo MonyCoin/meco_wallet --notes-file /tmp/notes.md
